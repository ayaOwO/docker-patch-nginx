[project]
name = "echo"
version = "0.1.0"
description = "Add your description here"
readme = "../README.md"
authors = [
    { name = "Aya Kraise", email = "tatytoy1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
]

[tool.fastapi]
entrypoint = "echo.main:app"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
strict = true
